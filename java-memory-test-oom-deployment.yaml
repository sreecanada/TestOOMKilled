apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-memory-test-oom

spec:
  replicas: 4

  selector:
    matchLabels:
      app: java-memory-test-oom

  template:
    metadata:
      labels:
        app: java-memory-test-oom

    spec:
      containers:
        - name: java-memory-test
          image: java-memory-test:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx1024m"